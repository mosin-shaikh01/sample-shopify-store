name: Deploy to Shopify Dev Theme

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm deployment'
        required: true
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "Deployment aborted: confirmation not provided"
            exit 1
          fi
          echo "✓ Deployment confirmed"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Deploy to Shopify
        env:
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          THEME_ID: ${{ secrets.SHOPIFY_THEME_ID }}
        run: |
          echo "Deploying to development theme: $THEME_ID"
          shopify theme push \
            --store $SHOPIFY_STORE_URL \
            --theme $THEME_ID \
            --nodelete \
            --ignore config/settings_data.json

      - name: Deployment Success
        run: |
          echo "✓ Successfully deployed to development theme"
          echo "Preview URL: https://${{ secrets.SHOPIFY_STORE_URL }}/cdn/shop/t/${{ secrets.SHOPIFY_THEME_ID }}/preview"
